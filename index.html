<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Objects</title>
  <script type="module"
          src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { margin: 0 0 22px; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 12px 12px 16px;
      box-shadow: 0 5px 24px rgba(0,0,0,.08);
    }
    model-viewer {
      width: 100%;
      height: 430px;
      background: linear-gradient(#fafafa, #ececec);
      border-radius: 14px;
    }
    .title {
      margin: 14px 4px 10px;
      font-weight: 700;
      font-size: 18px;
    }
    .ar-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: #111;
      cursor: pointer;
    }
    .ar-button:active { transform: scale(.99); }
    .hint {
      margin: 18px 4px 0;
      color: #666;
      line-height: 1.45;
      font-size: 14px;
    }
    #status {
      position: fixed;
      inset: auto 16px 16px 16px;
      max-width: 600px;
      margin: auto;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.82);
      color: white;
      font-size: 14px;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <main>
    <h1>AR Objects</h1>
    <p class="sub">Нажми «Открыть в AR», чтобы увидеть объект через камеру.</p>

    <div class="grid">
      <section class="card">
        <model-viewer id="viewer1"
          src="./models/object-1.glb"
          alt="AR объект 1"
          camera-controls
          touch-action="pan-y"
          ar
          ar-modes="webxr scene-viewer quick-look"
          exposure="1"
          shadow-intensity="1"
          environment-image="neutral"
          loading="eager">
          <button class="ar-button" slot="ar-button">Открыть в AR</button>
        </model-viewer>
        <div class="title">Объект 1</div>
      </section>

      <section class="card">
        <model-viewer id="viewer2"
          src="./models/object-2.glb"
          alt="AR объект 2"
          camera-controls
          touch-action="pan-y"
          ar
          ar-modes="webxr scene-viewer quick-look"
          exposure="1"
          shadow-intensity="1"
          environment-image="neutral"
          loading="eager">
          <button class="ar-button" slot="ar-button">Открыть в AR</button>
        </model-viewer>
        <div class="title">Объект 2</div>
      </section>
    </div>

    <p class="hint">
      На телефоне сначала откроется модель, затем кнопка AR передаст её в режим дополненной реальности.
      На Android используется Scene Viewer/WebXR, на iPhone/iPad — Quick Look, когда он доступен.
    </p>
  </main>

  <div id="status"></div>

  <script>
    const status = document.getElementById('status');
    function showStatus(text) {
      status.textContent = text;
      status.style.display = 'block';
      clearTimeout(window._statusTimer);
      window._statusTimer = setTimeout(() => status.style.display = 'none', 4500);
    }

    document.querySelectorAll('model-viewer').forEach((viewer) => {
      viewer.addEventListener('error', () => {
        showStatus('Не удалось загрузить 3D-модель. Проверь интернет-соединение.');
      });
      viewer.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'failed') {
          showStatus('AR недоступен на этом устройстве или в этом браузере.');
        }
      });
    });
  </script>
</body>
</html>
